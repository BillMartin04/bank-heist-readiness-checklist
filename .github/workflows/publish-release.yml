name: Publish checklist release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach PDF and publish v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0 Bank-Heist-Readiness-Checklist.pdf --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit v1.0 --draft=false --latest --repo "$GITHUB_REPOSITORY"
